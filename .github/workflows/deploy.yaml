name: deploy-on-Server
run-name: Deploy on Server Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_KEY }}
      
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/huaji-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/huaji-backend:${{ github.sha }}
      
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: PROD_ENV_FILE
          script: |
            set -e

            printf '%s\n' "$PROD_ENV_FILE" > /srv/huaji/build/.env
            chmod 600 /srv/huaji/build/.env

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/huaji-backend:latest

            docker stop huaji-backend || true
            docker rm huaji-backend || true

            docker run -d \
              --name huaji-backend \
              --env-file /srv/huaji/build/.env \
              -v /srv/huaji/data:/srv/huaji/data \
              --restart unless-stopped \
              -p 5000:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/huaji-backend:latest